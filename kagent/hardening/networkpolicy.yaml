# Only the authenticated MCP proxy can connect to the backend tool server.
# The egress gateway sends ActorJWT requests to the proxy, which validates the token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-tools-ingress
  namespace: kagent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-tools
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent-mcp-auth
      ports:
        - protocol: TCP
          port: 8084
