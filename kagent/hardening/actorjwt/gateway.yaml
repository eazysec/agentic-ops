gateways:
  mcp:
    port: 8080
    jwtAuth:
      mode: strict
      preserveToken: true
      issuer: https://idp.ate-system.svc
      audiences: [kagent-tools-mcp]
      jwks:
        url: https://idp.ate-system.svc/openid/v1/jwks
      jwtValidationOptions:
        requiredClaims: [exp]
routes:
  - name: kubernetes-tools
    gateways: [mcp]
    matches:
      - path:
          exact: /mcp
    policies:
      extAuthz:
        host: 127.0.0.1:8090
        failureMode: deny
        includeRequestHeaders: [authorization]
        protocol:
          http:
            path: '"/check"'
    backends:
      - host: kagent-tools.kagent.svc.cluster.local:8084
        policies:
          requestHeaderModifier:
            remove: [authorization]
