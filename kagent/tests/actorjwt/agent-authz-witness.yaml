# Temporary negative test. The production allowlist deliberately excludes this Agent.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: diag-authz-witness
  namespace: kagent
spec:
  description: Agent témoin pour vérifier le refus d’autorisation MCP
  modelConfig:
    name: openrouter-gpt41mini
  systemPrompt: Appelle uniquement l’outil de lecture des événements demandé, s’il est disponible.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tools-authenticated
        tools: [k8s_get_events]
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: diag-authz-witness
  namespace: kagent
spec:
  harnessRef:
    name: kagent-default
  template:
    ref:
      name: diag-authz-witness
